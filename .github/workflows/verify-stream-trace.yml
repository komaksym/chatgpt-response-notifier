name: Verify stream trace test branch

on:
  push:
    branches:
      - test/stream-trace-e2e

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Check content script syntax
        run: node --check content-script.js

      - name: Check network probe syntax
        run: node --check network-probe.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest: OK')"

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
